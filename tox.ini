[tox]
envlist = py3
skipsdist = false

[testenv]
description = Ejecutar tests con pytest y coverage
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    httpx>=0.24.0
commands =
    pytest tests/ -v --cov=src --cov-report=term-missing {posargs}

[testenv:lint]
description = Verificar estilo de código con flake8
deps =
    flake8>=6.0.0
commands =
    flake8 src/ tests/ --max-line-length=120 --exclude=__pycache__

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
